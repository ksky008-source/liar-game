<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이어 테이블</title>
<meta name="description" content="친구 4명이 각자 휴대폰·PC로 함께하는 온라인 라이어게임">
<meta name="theme-color" content="#0a1322">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }

/* Layout: one centered column on phones, a 2-column game table (role card + seats | action panel) from 860px. Single dark look by design. */
:root {
  --bg: #0a1322; --panel: #101c31; --raised: #172742; --line: #24375a; --line-soft: #1b2b48;
  --fg: #e7eef8; --muted: #8ea2c0; --faint: #5c7194;
  --mint: #3fe3bf; --mint-soft: rgba(63,227,191,.12); --mint-ink: #04251f;
  --liar: #ff7486; --liar-soft: rgba(255,116,134,.12); --warn: #f2c35b;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  background-image: radial-gradient(1200px 500px at 50% -200px, rgba(63,227,191,.08), transparent 70%); }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .5px; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip strong { color: var(--mint); letter-spacing: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 20px; min-width: 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--raised); border-radius: 11px; padding: 12px 18px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--mint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); }
.btn.primary:hover:not(:disabled) { background: #69ecd0; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; outline: none; }
input[type=text]:focus { border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
input.code { font-family: var(--f-mono); letter-spacing: .35em; text-transform: uppercase; font-size: 18px; }

/* home */
.home { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .home { grid-template-columns: 1.1fr 1fr; align-items: start; } }
.hero { display: flex; flex-direction: column; gap: 14px; padding-block: 6px; }
.hero h1 em { font-style: normal; color: var(--mint); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps .n { font-family: var(--f-mono); font-size: 12px; color: var(--mint); border: 1px solid var(--line); border-radius: 8px; height: 26px; display: grid; place-items: center; }
.steps b { display: block; font-weight: 700; }
.steps span { color: var(--muted); font-size: 14px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

/* lobby */
.codebox { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 18px 20px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--bg); }
.code-big { font-family: var(--f-mono); font-weight: 700; font-size: clamp(30px, 8vw, 44px); letter-spacing: .3em; color: var(--mint); }
.seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .seats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.seat { border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px; background: var(--raised); display: flex; flex-direction: column; gap: 6px; min-height: 92px; min-width: 0; }
.seat.empty { background: transparent; border-style: dashed; color: var(--faint); }
.seat .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.seat .nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--mint-soft); color: var(--mint); margin-right: 4px; }
.tag.me { background: rgba(255,255,255,.07); color: var(--fg); }
.hint { font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.hint b { color: var(--fg); }

/* game */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 18px; }
.stepper div { font-size: 12px; text-align: center; padding-top: 8px; border-top: 3px solid var(--line-soft); color: var(--faint); font-weight: 500; }
.stepper div.done { border-color: rgba(63,227,191,.35); color: var(--muted); }
.stepper div.on { border-color: var(--mint); color: var(--fg); font-weight: 700; }
.table { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .table { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } }
.rolecard { position: relative; border-radius: 18px; padding: 22px; min-height: 230px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); background:
  repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 10px, transparent 10px 20px), var(--raised); }
.rolecard.citizen { border-color: rgba(63,227,191,.5); }
.rolecard.liar { border-color: rgba(255,116,134,.55); background: repeating-linear-gradient(135deg, rgba(255,116,134,.04) 0 10px, transparent 10px 20px), var(--raised); }
.rolecard .cat { font-size: 13px; color: var(--muted); }
.rolecard .cat b { color: var(--fg); font-size: 15px; }
.rolecard .word { font-family: var(--f-display); font-size: 40px; line-height: 1.1; color: var(--mint); overflow-wrap: anywhere; }
.rolecard.liar .word { color: var(--liar); font-size: 30px; }
.rolecard .seal { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.rolecard .cover { flex: 1; display: grid; place-items: center; text-align: center; gap: 8px; border: 1px dashed var(--line); border-radius: 12px; padding: 18px; cursor: pointer; background: transparent; }
.rolecard .cover:hover { border-color: var(--mint); }
.roster { display: flex; flex-direction: column; gap: 6px; }
.rp { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; }
.rp .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); text-align: center; }
.rp .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp .st { font-size: 12px; color: var(--faint); }
.rp.turn { background: var(--mint-soft); }
.rp.turn .st { color: var(--mint); font-weight: 700; }
.status { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--raised); }
.status.mine { background: var(--mint-soft); border: 1px solid rgba(63,227,191,.4); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); margin-top: 7px; flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .btn { transition: none; } }
.log { display: flex; flex-direction: column; gap: 16px; }
.round h3 { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: 26px 72px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-soft); }
.line .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.line .who { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .txt { overflow-wrap: anywhere; }
.line.pending .txt { color: var(--faint); }
.line.now { border-color: var(--mint); }
.line.now .txt { color: var(--mint); }
.compose { display: flex; gap: 8px; flex-wrap: wrap; }
.compose input { flex: 1 1 220px; min-width: 0; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pick { text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick .no { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.pick b { overflow-wrap: anywhere; }
.pick[aria-pressed=true] { border-color: var(--mint); background: var(--mint-soft); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.words { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.tally { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 90px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 14px; }
.bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.bar .fill { height: 100%; background: var(--mint); border-radius: 6px; }
.bar.sus .fill { background: var(--liar); }
.bar .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.verdict { padding: 22px; border-radius: 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.verdict.citizen { background: var(--mint-soft); border: 1px solid rgba(63,227,191,.45); }
.verdict.liar { background: var(--liar-soft); border: 1px solid rgba(255,116,134,.5); }
.verdict .big { font-family: var(--f-display); font-size: clamp(30px, 6vw, 40px); }
.verdict.citizen .big { color: var(--mint); }
.verdict.liar .big { color: var(--liar); }
.reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .reveal { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.reveal .seat .role { font-size: 13px; font-weight: 700; color: var(--mint); }
.reveal .seat.isliar { border-color: rgba(255,116,134,.6); }
.reveal .seat.isliar .role { color: var(--liar); }
.reveal .seat small { color: var(--muted); font-size: 12px; }
.warn { color: var(--warn); font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100% - 32px)); width: max-content; background: var(--raised); border: 1px solid var(--liar); color: var(--fg); padding: 12px 14px 12px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 10; }
.toast.info { border-color: var(--mint); }
.toast button { background: none; border: 0; color: var(--muted); cursor: pointer; font-weight: 700; padding: 4px; }
.center { min-height: 50vh; display: grid; place-items: center; text-align: center; }
footer.foot { margin-top: 28px; font-size: 12px; color: var(--faint); text-align: center; }

.rp .on { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 6px; vertical-align: middle; }
.rp .on.yes { background: var(--mint); }
.conn { font-size: 12px; color: var(--warn); }
.stepper div { word-break: keep-all; }
@media (max-width: 859px) {
  .table > aside { display: contents; }
  .table > aside > .rolecard { order: 1; }
  .table > section { order: 2; }
  .table > aside > .panel { order: 3; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">L</div><b>라이어 테이블</b></div>
    <div id="hdr"></div>
  </header>
  <main id="app" aria-live="polite">
    <div class="center"><div class="stack"><h2>테이블 준비 중</h2><p class="muted">서버에 연결하고 있어요. 처음 접속이면 30초쯤 걸릴 수 있어요.</p></div></div>
  </main>
  <footer class="foot">4인 전용 · 역할과 제시어는 서버가 본인에게만 보내요</footer>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  const $app = document.getElementById('app'), $hdr = document.getElementById('hdr'), $toast = document.getElementById('toast');
  const ls = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  const S = { token: ls.get('liar.token'), view: null, error: null, notice: null, busy: false, connected: false, loading: !!ls.get('liar.token') };
  const ui = { cardShown: false, cardKey: '', votePick: null, guessPick: null, copied: false };
  let es = null, lastHtml = '', raf = 0;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const queue = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };

  // ---------- server ----------
  async function post(path, body) {
    let r;
    try { r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw '서버에 연결할 수 없어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'; }
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { if (r.status === 401 || r.status === 410) forget(); throw j.error || ('서버 오류가 났어요. (' + r.status + ')'); }
    return j;
  }
  function forget() { ls.del('liar.token'); S.token = ''; S.view = null; S.loading = false; if (es) { es.close(); es = null; } }
  function connect() {
    if (es) es.close();
    if (!S.token) { queue(); return; }
    es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));
    es.onmessage = e => { S.view = JSON.parse(e.data); S.connected = true; S.loading = false; queue(); };
    es.onopen = () => { S.connected = true; queue(); };
    es.onerror = async () => {
      S.connected = false; queue();
      // 토큰이 무효해졌는지 확인 (방 삭제 등)
      try {
        const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, type: 'ping' }) });
        if (r.status === 401 || r.status === 410) { const j = await r.json().catch(() => ({})); forget(); S.notice = j.error || '방에서 나왔어요.'; queue(); }
      } catch (e) {}
    };
  }
  async function act(fn) {
    if (S.busy) return false; S.busy = true; S.error = null; queue();
    try { await fn(); return true; } catch (e) { S.error = typeof e === 'string' ? e : '문제가 생겼어요: ' + (e && e.message || e); return false; } finally { S.busy = false; queue(); }
  }
  const send = (type, extra) => act(() => post('/api/action', Object.assign({ token: S.token, type }, extra || {})));

  // ---------- render ----------
  function render() {
    const V = S.view;
    let html;
    if (S.loading) html = '<div class="center"><div class="stack"><h2>다시 연결하는 중</h2><p class="muted">하던 방으로 돌아가고 있어요.</p><button class="btn ghost" type="button" data-act="reset">처음 화면으로</button></div></div>';
    else if (!S.token || !V) html = homeView();
    else if (V.status !== 'play') html = lobbyView(V);
    else html = gameView(V);
    $hdr.innerHTML = V && S.token ? '<span class="chip">방 코드 <strong>' + esc(V.code) + '</strong></span>' + (S.connected ? '' : ' <span class="conn">재연결 중…</span>') : '';
    if (html !== lastHtml) {
      const keep = {};
      ['nick', 'code', 'desc'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = { v: el.value, f: document.activeElement === el, s: el.selectionStart }; });
      $app.innerHTML = html; lastHtml = html;
      Object.keys(keep).forEach(id => { const el = document.getElementById(id); if (el) { el.value = keep[id].v; if (keep[id].f) { el.focus(); try { el.setSelectionRange(keep[id].s, keep[id].s); } catch (e) {} } } });
      const d = document.getElementById('desc'); if (d) updateCount(d);
    }
    const msg = S.error || S.notice;
    $toast.innerHTML = msg ? '<div class="toast' + (S.error ? '' : ' info') + '" role="alert"><span>' + esc(msg) + '</span><button type="button" data-act="dismiss" aria-label="닫기">닫기</button></div>' : '';
  }
  const nick = (V, i) => (V.players[i] && V.players[i].nick) || '참가자';
  const names = (V, list) => list.map(i => nick(V, i) + '님').join(', ');

  function homeView() {
    const pre = (location.hash.match(/^#([A-Za-z0-9]{5})$/) || [])[1] || '';
    return '<div class="home">' +
      '<section class="hero"><span class="label">4인 온라인 추리 게임</span>' +
      '<h1>네 명 중 한 명은<br><em>제시어를 모릅니다</em></h1>' +
      '<p class="muted">방을 만들고 초대 코드를 친구 세 명에게 보내세요. 각자 휴대폰이나 PC에서 들어오면 바로 시작할 수 있어요.</p>' +
      '<ol class="steps">' +
      '<li><span class="n">1</span><div><b>역할 받기</b><span>시민 3명은 같은 제시어를, 라이어 1명은 카테고리만 받아요.</span></div></li>' +
      '<li><span class="n">2</span><div><b>두 바퀴 설명</b><span>1번부터 4번까지 차례로 한 줄씩, 두 바퀴 돌아요.</span></div></li>' +
      '<li><span class="n">3</span><div><b>비밀 투표</b><span>모두 투표를 마칠 때까지 누가 누구를 찍었는지 안 보여요.</span></div></li>' +
      '<li><span class="n">4</span><div><b>최종 판정</b><span>라이어가 지목되면 제시어를 맞힐 마지막 기회가 있어요.</span></div></li>' +
      '</ol></section>' +
      '<section class="panel stack">' +
      '<div class="field"><label for="nick">닉네임 (10자 이하)</label><input type="text" id="nick" maxlength="10" placeholder="예: 지훈" value="' + esc(ls.get('liar.nick')) + '" autocomplete="nickname"></div>' +
      '<button class="btn primary block" type="button" data-act="create"' + (S.busy ? ' disabled' : '') + '>새 방 만들기</button>' +
      '<div class="or">또는 초대받은 방에 참가</div>' +
      '<div class="field"><label for="code">초대 코드 5자리</label><input type="text" id="code" class="code" maxlength="5" placeholder="ABCDE" value="' + esc(pre) + '" autocomplete="off" autocapitalize="characters"></div>' +
      '<button class="btn block" type="button" data-act="join"' + (S.busy ? ' disabled' : '') + '>코드로 참가하기</button>' +
      '</section></div>';
  }

  function lobbyView(V) {
    const isHost = V.host === V.me, n = V.players.length, full = n === 4;
    let seats = '';
    for (let i = 0; i < 4; i++) {
      const p = V.players[i];
      if (!p) { seats += '<div class="seat empty"><span class="no">' + (i + 1) + '번 자리</span><span>빈 자리</span></div>'; continue; }
      seats += '<div class="seat"><span class="no">' + (i + 1) + '번 자리' + (p.online ? '' : ' · 접속 끊김') + '</span><span class="nm">' + esc(p.nick) + '</span><span>' +
        (i === V.host ? '<span class="tag">방장</span>' : '') + (i === V.me ? '<span class="tag me">나</span>' : '') + '</span></div>';
    }
    const link = location.origin + '/#' + V.code;
    return '<div class="stack" style="gap:18px">' +
      '<div class="row" style="justify-content:space-between"><div><span class="label">대기실</span><h2>' + n + ' / 4명 입장</h2></div>' +
      '<button class="btn ghost" type="button" data-act="leave"' + (S.busy ? ' disabled' : '') + '>방 나가기</button></div>' +
      '<div class="codebox"><div style="min-width:0"><div class="label">초대 코드</div><div class="code-big">' + esc(V.code) + '</div><div class="muted" style="font-size:13px;overflow-wrap:anywhere">' + esc(link) + '</div></div>' +
      '<button class="btn" type="button" data-act="copy">' + (ui.copied ? '복사했어요' : '초대 링크 복사') + '</button></div>' +
      '<div class="seats">' + seats + '</div>' +
      (isHost
        ? '<button class="btn primary block" type="button" data-act="start"' + (full && !S.busy ? '' : ' disabled') + '>' + (full ? '게임 시작' : (4 - n) + '명 더 들어오면 시작할 수 있어요') + '</button>'
        : '<div class="status"><span class="dot"></span><p>' + (full ? '방장이 게임을 시작하기를 기다리고 있어요.' : '나머지 ' + (4 - n) + '명이 들어오기를 기다리고 있어요.') + '</p></div>') +
      '<p class="hint"><b>친구 초대</b> · 초대 링크를 카카오톡 등으로 보내면 코드가 자동으로 채워져요.</p>' +
      '</div>';
  }

  const STEPS = ['역할 배정', '설명 1라운드', '설명 2라운드', '비밀 투표', '최종 판정'];
  function stepOf(V) { return V.phase === 'desc' ? 1 + V.round : V.phase === 'vote' ? 3 : 4; }

  function gameView(V) {
    const step = stepOf(V);
    const key = V.code + V.n;
    if (ui.cardKey !== key) { ui.cardKey = key; ui.cardShown = false; ui.votePick = null; ui.guessPick = null; }
    const stepper = '<div class="stepper" role="list">' + STEPS.map((s, i) => '<div role="listitem" class="' + (i < step || V.phase === 'end' ? 'done' : i === step ? 'on' : '') + '">' + s + '</div>').join('') + '</div>';
    return stepper + '<div class="table"><aside class="stack">' + roleCard(V) + roster(V) + '</aside><section class="panel stack" style="gap:18px">' + mainPanel(V) + '</section></div>';
  }

  function roleCard(V) {
    const card = V.card, catLine = '<div class="cat">카테고리 · <b>' + esc(V.category) + '</b></div>';
    const foot = '<span>' + (V.me + 1) + '번 자리 · ' + V.n + '번째 판</span>';
    if (!ui.cardShown) return '<div class="rolecard">' + catLine + '<button type="button" class="cover" data-act="showcard"><div><h3>내 카드 확인하기</h3><p class="muted" style="font-size:13px;margin-top:6px">다른 사람이 화면을 보지 않을 때 누르세요</p></div></button><div class="seal">' + foot + '</div></div>';
    const body = card.liar
      ? '<span class="label" style="color:var(--liar)">당신의 역할</span><div class="word">당신은 라이어입니다.</div><p class="muted" style="font-size:13.5px">제시어는 모르고 카테고리만 알아요. 시민인 척 설명하세요.</p>'
      : '<span class="label">시민 · 제시어</span><div class="word">' + esc(card.word) + '</div><p class="muted" style="font-size:13.5px">제시어를 직접 말하지 않고 설명하세요.</p>';
    return '<div class="rolecard ' + (card.liar ? 'liar' : 'citizen') + '">' + catLine + body + '<div class="seal">' + foot + '<button type="button" class="btn ghost" style="padding:6px 10px;font-size:12px" data-act="hidecard">가리기</button></div></div>';
  }

  function roster(V) {
    const rows = V.players.map((p, i) => {
      let st = '';
      if (V.phase === 'desc') st = i === V.turnSeat ? '설명 차례' : '';
      else if (V.phase === 'vote') st = V.voted[i] ? '투표 완료' : '투표 중';
      else if (V.phase === 'claim') st = i === V.suspect ? '지목됨' : '';
      const turn = (V.phase === 'desc' && i === V.turnSeat) || (V.phase === 'claim' && i === V.suspect);
      return '<div class="rp' + (turn ? ' turn' : '') + '"><span class="no">' + (i + 1) + '</span><span class="nm"><span class="on' + (p.online ? ' yes' : '') + '" title="' + (p.online ? '접속 중' : '접속 끊김') + '"></span>' + esc(p.nick) + (i === V.me ? ' <span class="tag me">나</span>' : '') + '</span><span class="st">' + st + '</span></div>';
    }).join('');
    const stop = V.host === V.me && V.phase !== 'end' ? '<button class="btn ghost" type="button" data-act="abort" style="margin:8px 10px 4px;padding:8px 12px;font-size:13px">게임 중단하고 대기실로</button>' : '';
    return '<div class="panel" style="padding:12px"><div class="label" style="padding:4px 10px 8px">좌석 순서</div><div class="roster">' + rows + '</div>' + stop + '</div>';
  }

  function waitBox(text, mine) { return '<div class="status' + (mine ? ' mine' : '') + '"><span class="dot"></span><p>' + text + '</p></div>'; }

  function descLog(V) {
    let out = '<div class="log">';
    for (let r = 0; r < 2; r++) {
      out += '<div class="round"><h3>' + (r + 1) + '라운드</h3><div class="lines">';
      for (let s = 0; s < 4; s++) {
        const k = r * 4 + s, d = V.desc[k];
        const now = V.phase === 'desc' && V.turn === k;
        const txt = d ? esc(d.text) : now ? '작성 중…' : '차례 대기';
        out += '<div class="line' + (d ? '' : ' pending') + (now ? ' now' : '') + '"><span class="no">' + (s + 1) + '</span><span class="who">' + esc(nick(V, s)) + '</span><span class="txt">' + txt + '</span></div>';
      }
      out += '</div></div>';
    }
    return out + '</div>';
  }

  function mainPanel(V) {
    const busy = S.busy ? ' disabled' : '';
    if (V.phase === 'desc') {
      const mine = V.turnSeat === V.me;
      let top = '<div><span class="label">' + (V.round + 1) + '라운드 · ' + (V.turnSeat + 1) + '번 차례</span><h2>' + (mine ? '내 차례예요. 한 줄로 설명하세요' : esc(nick(V, V.turnSeat)) + '님이 설명하고 있어요') + '</h2></div>';
      if (mine) top += '<div class="stack" style="gap:8px"><div class="compose"><input type="text" id="desc" maxlength="' + V.maxDesc + '" placeholder="' + (V.card.liar ? '시민인 척, 들키지 않게' : '제시어를 직접 말하지 않고') + '" autocomplete="off" enterkeyhint="send">' +
        '<button class="btn primary" type="button" data-act="describe"' + busy + '>제출</button></div><span class="count" id="desc-count">0 / ' + V.maxDesc + '</span></div>';
      return top + descLog(V);
    }
    if (V.phase === 'vote') {
      const voted = V.myVote !== null;
      const left = [0, 1, 2, 3].filter(i => !V.voted[i]);
      let h = '<div><span class="label">비밀 투표</span><h2>' + (voted ? esc(nick(V, V.myVote)) + '님에게 투표했어요' : '라이어라고 생각하는 사람을 고르세요') + '</h2></div>';
      if (!voted) {
        h += '<div class="picks">' + V.players.map((p, i) => i === V.me ? '' :
          '<button type="button" class="pick" data-act="pickvote" data-i="' + i + '" aria-pressed="' + (ui.votePick === i) + '"><span class="no">' + (i + 1) + '번</span><b>' + esc(p.nick) + '</b></button>').join('') + '</div>' +
          '<button class="btn primary block" type="button" data-act="vote"' + (ui.votePick === null || S.busy ? ' disabled' : '') + '>' + (ui.votePick === null ? '한 명을 골라 주세요' : esc(nick(V, ui.votePick)) + '님에게 투표하기') + '</button>';
      } else h += waitBox('남은 사람: ' + esc(names(V, left)) + '. 모두 투표하면 결과가 한꺼번에 공개돼요.');
      return h + descLog(V);
    }
    if (V.phase === 'claim') {
      let h = '<div><span class="label">최종 판정</span><h2>' + esc(nick(V, V.suspect)) + '님이 지목됐어요</h2></div>' + tallyView(V);
      if (V.words) {
        h += '<div class="status mine" style="display:block"><b>마지막 기회예요.</b> 제시어를 맞히면 라이어가 이겨요. 카테고리 <b>' + esc(V.category) + '</b>에서 하나를 고르세요.</div>' +
          '<div class="picks words">' + V.words.map((w, i) => '<button type="button" class="pick" data-act="pickguess" data-i="' + i + '" aria-pressed="' + (ui.guessPick === i) + '"><b>' + esc(w) + '</b></button>').join('') + '</div>' +
          '<button class="btn primary block" type="button" data-act="guess"' + (ui.guessPick === null || S.busy ? ' disabled' : '') + '>' + (ui.guessPick === null ? '제시어를 골라 주세요' : '"' + esc(V.words[ui.guessPick]) + '"(으)로 정답 제출') + '</button>';
      } else h += waitBox(esc(nick(V, V.suspect)) + '님이 진짜 라이어였어요! 지금 제시어를 맞힐 마지막 기회를 쓰고 있어요.');
      return h;
    }
    return endView(V);
  }

  function tallyView(V) {
    const max = Math.max(1, ...V.tally);
    return '<div class="tally">' + V.players.map((p, i) => '<div class="bar' + (i === V.suspect ? ' sus' : '') + '"><span class="nm">' + esc(p.nick) + '</span><span class="track"><span class="fill" style="display:block;width:' + (V.tally[i] / max * 100) + '%"></span></span><span class="v">' + V.tally[i] + '</span></div>').join('') + '</div>' +
      (V.ties.length > 1 ? '<p class="muted" style="font-size:13px">' + esc(names(V, V.ties)) + ' 동률이라 무작위로 한 명을 골랐어요.</p>' : '');
  }

  function endView(V) {
    const R = V.result;
    const myWin = (R.winner === 'liar') === (V.me === R.liar);
    let h = '<div class="verdict ' + R.winner + '"><span class="label">' + (myWin ? '승리했어요' : '아쉽게 졌어요') + '</span><div class="big">' + (R.winner === 'liar' ? '라이어 승리' : '시민 승리') + '</div><p class="muted">' + esc(R.reason) + '</p></div>';
    h += '<div class="row" style="justify-content:space-between"><div><span class="label">제시어</span><h2>' + esc(V.category) + ' · ' + esc(R.word) + '</h2></div>' +
      (R.guess !== null ? '<p class="muted">라이어의 추측: <b style="color:var(--fg)">' + esc(R.guess) + '</b></p>' : '') + '</div>';
    h += '<div class="reveal">' + V.players.map((p, i) => {
      const isL = i === R.liar;
      return '<div class="seat' + (isL ? ' isliar' : '') + '"><span class="no">' + (i + 1) + '번</span><span class="nm">' + esc(p.nick) + '</span><span class="role">' + (isL ? '라이어' : '시민') + (i === V.suspect ? ' · 지목됨' : '') + '</span><small>투표 → ' + esc(nick(V, R.votes[i])) + '</small></div>';
    }).join('') + '</div>';
    h += tallyView(V);
    h += V.host === V.me
      ? '<div class="row"><button class="btn primary" type="button" data-act="restart"' + (S.busy || V.players.length !== 4 ? ' disabled' : '') + '>같은 멤버로 다시 하기</button><button class="btn ghost" type="button" data-act="lobby"' + (S.busy ? ' disabled' : '') + '>대기실로</button></div>'
      : '<div class="row"><p class="muted" style="flex:1">방장이 다시 시작하면 새 판이 열려요.</p><button class="btn ghost" type="button" data-act="lobby"' + (S.busy ? ' disabled' : '') + '>대기실로</button></div>';
    return h + descLog(V);
  }

  function updateCount(el) { const c = document.getElementById('desc-count'); if (c) c.textContent = [...el.value].length + ' / ' + (S.view ? S.view.maxDesc : 60); }

  // ---------- events ----------
  document.addEventListener('input', e => { if (e.target.id === 'desc') updateCount(e.target); if (e.target.id === 'nick') ls.set('liar.nick', e.target.value); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.id === 'desc') { e.preventDefault(); doAct('describe'); }
    if (e.target.id === 'code') { e.preventDefault(); doAct('join'); }
    if (e.target.id === 'nick') { e.preventDefault(); doAct(document.getElementById('code').value.trim() ? 'join' : 'create'); }
  });
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) doAct(b.dataset.act, b); });
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  async function enter(path, body) {
    let res;
    const ok = await act(async () => { res = await post(path, body); });
    if (!ok) return;
    S.token = res.token; ls.set('liar.token', res.token); S.notice = null; S.loading = true;
    if (location.hash) history.replaceState(null, '', location.pathname);
    connect();
  }
  async function doAct(a, el) {
    switch (a) {
      case 'create': return enter('/api/create', { nick: val('nick') });
      case 'join': return enter('/api/join', { nick: val('nick'), code: val('code') });
      case 'leave': if (await send('leave')) { forget(); queue(); } return;
      case 'start': case 'restart': return send('start');
      case 'lobby': return send('lobby');
      case 'abort': ui.abort = !ui.abort; if (ui.abort) { S.notice = '정말 중단하려면 버튼을 한 번 더 누르세요.'; setTimeout(() => { ui.abort = false; }, 4000); queue(); return; } S.notice = null; return send('lobby');
      case 'reset': forget(); queue(); return;
      case 'dismiss': S.error = null; S.notice = null; return queue();
      case 'showcard': ui.cardShown = true; return queue();
      case 'hidecard': ui.cardShown = false; return queue();
      case 'pickvote': ui.votePick = +el.dataset.i; return queue();
      case 'pickguess': ui.guessPick = +el.dataset.i; return queue();
      case 'vote': if (ui.votePick !== null) await send('vote', { target: ui.votePick }); return;
      case 'guess': if (ui.guessPick !== null) await send('guess', { word: ui.guessPick }); return;
      case 'describe': {
        const d = document.getElementById('desc'); if (!d) return;
        if (await send('describe', { text: d.value })) { const d2 = document.getElementById('desc'); if (d2) d2.value = ''; }
        return;
      }
      case 'copy': {
        const link = location.origin + '/#' + S.view.code;
        try { await navigator.clipboard.writeText(link); ui.copied = true; } catch (err) { S.notice = '복사가 안 되면 링크를 길게 눌러 복사해 주세요: ' + link; }
        queue(); setTimeout(() => { ui.copied = false; queue(); }, 1800);
        return;
      }
    }
  }
  connect(); queue();
})();
</script>
</body>
</html>
