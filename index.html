<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이어게임</title>
<meta name="description" content="친구들과 각자 휴대폰·PC로 함께하는 실시간 온라인 라이어게임 (노멀·바보·스파이모드, 4~8인)">
<meta name="author" content="KIMJIHUN">
<meta name="creator" content="KIMJIHUN">
<meta name="copyright" content="Copyright © 2026 KIMJIHUN. All rights reserved.">
<meta property="og:title" content="라이어게임">
<meta property="og:description" content="4~8명이 함께하는 실시간 온라인 라이어게임 · MADE BY KIMJIHUN">
<meta name="theme-color" content="#0a1322">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column on phones; from 860px a 2-column game table (role card + seats | action panel). Single dark look by design. */
:root {
  --bg: #0a1322; --panel: #101c31; --raised: #172742; --line: #24375a; --line-soft: #1b2b48;
  --fg: #e7eef8; --muted: #8ea2c0; --faint: #5c7194;
  --mint: #3fe3bf; --mint-soft: rgba(63,227,191,.12); --mint-ink: #04251f;
  --amber: #f2b45b; --amber-soft: rgba(242,180,91,.12);
  --liar: #ff7486; --liar-soft: rgba(255,116,134,.12);
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  background-image: radial-gradient(1200px 500px at 50% -200px, rgba(63,227,191,.08), transparent 70%); }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 32px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 17px; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .5px; }
.chip { font-family: var(--f-mono); font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; }
.chip strong { color: var(--mint); letter-spacing: 2px; }
.chip.mode { color: var(--amber); border-color: rgba(242,180,91,.4); font-family: var(--f-body); font-weight: 700; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 48px); line-height: 1.15; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 20px; min-width: 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--raised); border-radius: 11px; padding: 12px 18px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; min-height: 46px; }
.btn:hover:not(:disabled) { border-color: var(--mint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); }
.btn.primary:hover:not(:disabled) { background: #69ecd0; }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 12px; font-size: 13px; min-height: 36px; }
.btn.block { width: 100%; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; outline: none; min-height: 46px; }
input[type=text]:focus { border-color: var(--mint); box-shadow: 0 0 0 3px var(--mint-soft); }
input.code { font-family: var(--f-mono); letter-spacing: .35em; text-transform: uppercase; font-size: 18px; }

/* home */
.home { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .home { grid-template-columns: 1fr 1fr; align-items: start; } }
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero h1 em { font-style: normal; color: var(--mint); }
.modes { display: grid; gap: 10px; grid-template-columns: 1fr; }
.modecard { text-align: left; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 14px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.modecard:hover { border-color: rgba(63,227,191,.5); }
.modecard .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.modecard b { font-size: 16px; }
.modecard .min { font-family: var(--f-mono); font-size: 12px; color: var(--amber); white-space: nowrap; padding-top: 3px; }
.modecard p { grid-column: 2 / 4; color: var(--muted); font-size: 13.5px; }
.modecard[aria-checked=true] { border-color: var(--mint); background: linear-gradient(0deg, var(--mint-soft), var(--mint-soft)), var(--panel); }
.modecard[aria-checked=true] .radio { border-color: var(--mint); background: radial-gradient(circle, var(--mint) 0 45%, transparent 50%); }
.or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

/* lobby */
.codebox { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 18px 20px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--bg); }
.code-big { font-family: var(--f-mono); font-weight: 700; font-size: clamp(30px, 8vw, 44px); letter-spacing: .3em; color: var(--mint); }
.seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .seats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.seat { border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px; background: var(--raised); display: flex; flex-direction: column; gap: 6px; min-height: 88px; min-width: 0; }
.seat.empty { background: transparent; border-style: dashed; color: var(--faint); }
.seat .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.seat .nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--mint-soft); color: var(--mint); margin-right: 4px; }
.tag.me { background: rgba(255,255,255,.07); color: var(--fg); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 110px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-size: 14px; }
.seg button[aria-pressed=true] { border-color: var(--mint); background: var(--mint-soft); color: var(--mint); }
.seg button:disabled { cursor: default; }
.hint { font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.hint b { color: var(--fg); }

/* game */
.stepper { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 18px; }
.stepper div { font-size: 12px; text-align: center; padding-top: 8px; border-top: 3px solid var(--line-soft); color: var(--faint); font-weight: 500; word-break: keep-all; }
.stepper div.done { border-color: rgba(63,227,191,.35); color: var(--muted); }
.stepper div.on { border-color: var(--mint); color: var(--fg); font-weight: 700; }
.table { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .table { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } }
@media (max-width: 859px) {
  .table > aside { display: contents; }
  .table > aside > .rolecard { order: 1; }
  .table > section { order: 2; }
  .table > aside > .panel { order: 3; }
}
.rolecard { position: relative; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line);
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 10px, transparent 10px 20px), var(--raised); }
.rolecard .cat { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.rolecard .cat b { color: var(--fg); font-size: 15px; }
.secret { position: relative; min-height: 150px; border-radius: 12px; }
.secret .inside { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; filter: blur(14px); opacity: 0; transition: opacity .15s, filter .15s; user-select: none; }
.secret .veil { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 13.5px; background: var(--bg); transition: opacity .15s; }
.secret .veil b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }
@media (hover: hover) { .secret:hover .inside { filter: none; opacity: 1; user-select: text; } .secret:hover .veil { opacity: 0; pointer-events: none; } }
.rolecard.open .secret .inside { filter: none; opacity: 1; user-select: text; }
.rolecard.open .secret .veil { opacity: 0; pointer-events: none; }
.word { font-family: var(--f-display); font-size: 40px; line-height: 1.1; color: var(--mint); overflow-wrap: anywhere; }
.inside.liar .word { color: var(--liar); font-size: 30px; }
.inside.spy .word { color: var(--amber); }
.spyline { font-size: 14px; padding: 8px 10px; border-radius: 9px; background: var(--amber-soft); color: var(--amber); }
.spyline b { color: var(--fg); }
.rolecard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.roster { display: flex; flex-direction: column; gap: 4px; }
.rp { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.rp .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); text-align: center; }
.rp .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp .st { font-size: 12px; color: var(--faint); }
.rp.turn { background: var(--mint-soft); }
.rp.turn .st { color: var(--mint); font-weight: 700; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 6px; vertical-align: middle; }
.live.yes { background: var(--mint); }
.status { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--raised); }
.status.mine { background: var(--mint-soft); border: 1px solid rgba(63,227,191,.4); display: block; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); margin-top: 7px; flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } .btn, .secret .inside, .secret .veil { transition: none; } }
.log { display: flex; flex-direction: column; gap: 16px; }
.round h3 { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: 24px 76px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-soft); }
.line .no { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.line .who { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line .txt { overflow-wrap: anywhere; }
.line.pending .txt { color: var(--faint); }
.line.now { border-color: var(--mint); }
.line.now .txt { color: var(--mint); }
.compose { display: flex; gap: 8px; flex-wrap: wrap; }
.compose input { flex: 1 1 220px; min-width: 0; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pick { text-align: left; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 46px; }
.pick .no { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.pick b { overflow-wrap: anywhere; }
.pick[aria-pressed=true] { border-color: var(--mint); background: var(--mint-soft); }
.words { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.progress { font-family: var(--f-mono); font-size: 13px; color: var(--amber); }
.tally { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 90px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 14px; }
.bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--mint); border-radius: 6px; }
.bar.sus .fill { background: var(--amber); }
.bar .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.verdict { padding: 22px; border-radius: 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.verdict.citizen { background: var(--mint-soft); border: 1px solid rgba(63,227,191,.45); }
.verdict.liar, .verdict.fool { background: var(--liar-soft); border: 1px solid rgba(255,116,134,.5); }
.verdict .big { font-family: var(--f-display); font-size: clamp(28px, 6vw, 40px); }
.verdict.citizen .big { color: var(--mint); }
.verdict.liar .big, .verdict.fool .big { color: var(--liar); }
.reveal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .reveal { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.reveal .seat { min-height: 0; }
.reveal .role { font-size: 13px; font-weight: 700; color: var(--mint); }
.reveal .seat.r-liar { border-color: rgba(255,116,134,.6); } .reveal .seat.r-liar .role { color: var(--liar); }
.reveal .seat.r-spy { border-color: rgba(242,180,91,.6); } .reveal .seat.r-spy .role { color: var(--amber); }
.reveal .seat.r-fool { border-color: rgba(255,116,134,.6); } .reveal .seat.r-fool .role { color: var(--liar); }
.reveal .seat small { color: var(--muted); font-size: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100% - 32px)); width: max-content; background: var(--raised); border: 1px solid var(--liar); color: var(--fg); padding: 12px 14px 12px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 10; }
.toast.info { border-color: var(--mint); }
.toast button { background: none; border: 0; color: var(--muted); cursor: pointer; font-weight: 700; padding: 4px; }
.center { min-height: 50vh; display: grid; place-items: center; text-align: center; }
.conn { font-size: 12px; color: var(--amber); }

/* credit */
footer.credit { margin-top: 36px; padding: 22px 16px 26px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border: 2px solid var(--mint); border-radius: 999px; background: var(--mint-soft); }
.badge .by { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: var(--muted); }
.badge .name { font-family: var(--f-mono); font-size: 20px; font-weight: 700; letter-spacing: .14em; color: var(--mint); }
footer.credit p { font-size: 12.5px; color: var(--faint); }
footer.credit p.copy { font-size: 13.5px; color: var(--muted); letter-spacing: .02em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">L</div><b>라이어게임</b></div>
    <div id="hdr" class="row"></div>
  </header>
  <main id="app" aria-live="polite">
    <div class="center"><div class="stack"><h2>라이어게임 준비 중</h2><p class="muted">서버에 연결하고 있어요. 처음 접속이면 30초쯤 걸릴 수 있어요.</p></div></div>
  </main>
</div>
<footer class="credit">
  <div class="badge" aria-label="제작자 KIMJIHUN"><span class="by">MADE BY</span><span class="name">KIMJIHUN</span></div>
  <p class="copy">Copyright © 2026 KIMJIHUN. All rights reserved.</p>
  <p>라이어게임 · 역할과 제시어는 서버가 본인에게만 보내요</p>
</footer>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  const $app = document.getElementById('app'), $hdr = document.getElementById('hdr'), $toast = document.getElementById('toast');
  const ls = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  const MODES = {
    normal: { name: '노멀모드', min: 4, desc: '라이어 1명만 제시어를 몰라요. 들키지 않거나, 걸려도 제시어를 맞히면 라이어 승리.' },
    fool: { name: '바보모드', min: 4, desc: '바보 1명은 비슷하지만 다른 제시어를 받아요. 본인은 자기가 바보인 줄 몰라요.' },
    spy: { name: '스파이모드', min: 5, desc: '스파이는 제시어와 라이어를 알고 라이어를 몰래 도와요. 라이어·스파이가 한 팀.' },
  };
  const S = { token: ls.get('liar.token'), view: null, error: null, notice: null, busy: false, connected: false, loading: !!ls.get('liar.token') };
  const ui = { mode: MODES[ls.get('liar.mode')] ? ls.get('liar.mode') : 'normal', cardOpen: false, cardKey: '', votePick: null, guessPick: null, copied: false, abort: false };
  let es = null, lastHtml = '', raf = 0;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const queue = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };

  // ---------- server ----------
  async function post(path, body) {
    let r;
    try { r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { throw '서버에 연결할 수 없어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'; }
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { if (r.status === 401 || r.status === 410) forget(); throw j.error || ('서버 오류가 났어요. (' + r.status + ')'); }
    return j;
  }
  function forget() { ls.del('liar.token'); S.token = ''; S.view = null; S.loading = false; if (es) { es.close(); es = null; } }
  function connect() {
    if (es) es.close();
    if (!S.token) { queue(); return; }
    es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));
    es.onmessage = e => { S.view = JSON.parse(e.data); S.connected = true; S.loading = false; queue(); };
    es.onopen = () => { S.connected = true; queue(); };
    es.onerror = async () => {
      S.connected = false; queue();
      try {
        const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, type: 'ping' }) });
        if (r.status === 401 || r.status === 410) { const j = await r.json().catch(() => ({})); forget(); S.notice = j.error || '방에서 나왔어요.'; queue(); }
      } catch (e) {}
    };
  }
  async function act(fn) {
    if (S.busy) return false; S.busy = true; S.error = null; queue();
    try { await fn(); return true; } catch (e) { S.error = typeof e === 'string' ? e : '문제가 생겼어요: ' + (e && e.message || e); return false; } finally { S.busy = false; queue(); }
  }
  const send = (type, extra) => act(() => post('/api/action', Object.assign({ token: S.token, type }, extra || {})));

  // ---------- render ----------
  function render() {
    const V = S.view;
    let html;
    if (S.loading) html = '<div class="center"><div class="stack"><h2>다시 연결하는 중</h2><p class="muted">하던 방으로 돌아가고 있어요.</p><button class="btn ghost" type="button" data-act="reset">처음 화면으로</button></div></div>';
    else if (!S.token || !V) html = homeView();
    else if (V.status !== 'play') html = lobbyView(V);
    else html = gameView(V);
    $hdr.innerHTML = V && S.token ? '<span class="chip mode">' + esc(MODES[V.mode].name) + '</span><span class="chip">방 코드 <strong>' + esc(V.code) + '</strong></span>' + (S.connected ? '' : '<span class="conn">재연결 중…</span>') : '';
    if (html !== lastHtml) {
      const keep = {};
      ['nick', 'code', 'desc'].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = { v: el.value, f: document.activeElement === el, s: el.selectionStart }; });
      $app.innerHTML = html; lastHtml = html;
      Object.keys(keep).forEach(id => { const el = document.getElementById(id); if (el) { el.value = keep[id].v; if (keep[id].f) { el.focus(); try { el.setSelectionRange(keep[id].s, keep[id].s); } catch (e) {} } } });
      const d = document.getElementById('desc'); if (d) updateCount(d);
    }
    const msg = S.error || S.notice;
    $toast.innerHTML = msg ? '<div class="toast' + (S.error ? '' : ' info') + '" role="alert"><span>' + esc(msg) + '</span><button type="button" data-act="dismiss" aria-label="닫기">닫기</button></div>' : '';
  }
  const nick = (V, i) => (V.players[i] && V.players[i].nick) || '참가자';
  const names = (V, list) => list.map(i => nick(V, i) + '님').join(', ');

  function homeView() {
    const pre = (location.hash.match(/^#([A-Za-z0-9]{5})$/) || [])[1] || '';
    const cards = Object.keys(MODES).map(k => '<button type="button" class="modecard" role="radio" data-act="pickmode" data-mode="' + k + '" aria-checked="' + (ui.mode === k) + '">' +
      '<span class="radio" aria-hidden="true"></span><b>' + MODES[k].name + '</b><span class="min">' + MODES[k].min + '~8명</span><p>' + MODES[k].desc + '</p></button>').join('');
    return '<div class="home">' +
      '<section class="hero"><span class="label">실시간 온라인 추리 게임</span>' +
      '<h1>라이어게임<br><em>누가 거짓말을 할까?</em></h1>' +
      '<p class="muted">방을 만들고 초대 링크를 보내세요. 4~8명이 각자 휴대폰이나 PC로 들어오면 바로 시작할 수 있어요. 라운드마다 무작위 순서로 설명한 뒤 비밀 투표로 범인을 찾아요.</p>' +
      '<div class="label" style="margin-top:6px">모드 선택</div><div class="modes" role="radiogroup" aria-label="게임 모드">' + cards + '</div></section>' +
      '<section class="panel stack">' +
      '<div class="field"><label for="nick">닉네임 (10자 이하)</label><input type="text" id="nick" maxlength="10" placeholder="닉네임을 입력해주세요." value="' + esc(ls.get('liar.nick')) + '" autocomplete="nickname"></div>' +
      '<button class="btn primary block" type="button" data-act="create"' + (S.busy ? ' disabled' : '') + '>' + MODES[ui.mode].name + '로 새 방 만들기</button>' +
      '<div class="or">또는 초대받은 방에 참가</div>' +
      '<div class="field"><label for="code">초대 코드 5자리</label><input type="text" id="code" class="code" maxlength="5" placeholder="ABCDE" value="' + esc(pre) + '" autocomplete="off" autocapitalize="characters"></div>' +
      '<button class="btn block" type="button" data-act="join"' + (S.busy ? ' disabled' : '') + '>코드로 참가하기</button>' +
      '<p class="hint">참가하는 사람은 모드를 고를 필요 없어요. 방장이 고른 모드로 함께 플레이해요.</p>' +
      '</section></div>';
  }

  function lobbyView(V) {
    const isHost = V.host === V.me, n = V.players.length, min = V.modes[V.mode].min, ok = n >= min;
    let seats = '';
    const slots = Math.max(min, Math.min(V.maxPlayers, n < 8 ? n + 1 : 8));
    for (let i = 0; i < slots; i++) {
      const p = V.players[i];
      if (!p) { seats += '<div class="seat empty"><span class="no">' + (i + 1) + '번 자리</span><span>빈 자리</span></div>'; continue; }
      seats += '<div class="seat"><span class="no">' + (i + 1) + '번 자리' + (p.online ? '' : ' · 접속 끊김') + '</span><span class="nm">' + esc(p.nick) + '</span><span>' +
        (i === V.host ? '<span class="tag">방장</span>' : '') + (i === V.me ? '<span class="tag me">나</span>' : '') + '</span></div>';
    }
    const link = location.origin + '/#' + V.code;
    const seg = '<div class="seg" role="group" aria-label="게임 모드">' + Object.keys(MODES).map(k => '<button type="button" data-act="setmode" data-mode="' + k + '" aria-pressed="' + (V.mode === k) + '"' + (isHost && !S.busy ? '' : ' disabled') + '>' + MODES[k].name + ' · ' + MODES[k].min + '명+</button>').join('') + '</div>';
    return '<div class="stack" style="gap:18px">' +
      '<div class="row" style="justify-content:space-between"><div><span class="label">대기실</span><h2>' + n + ' / ' + V.maxPlayers + '명 입장 · 시작 가능 ' + min + '명 이상</h2></div>' +
      '<button class="btn ghost" type="button" data-act="leave"' + (S.busy ? ' disabled' : '') + '>방 나가기</button></div>' +
      '<div class="codebox"><div style="min-width:0"><div class="label">초대 코드</div><div class="code-big">' + esc(V.code) + '</div><div class="muted" style="font-size:13px;overflow-wrap:anywhere">' + esc(link) + '</div></div>' +
      '<button class="btn" type="button" data-act="copy">' + (ui.copied ? '복사했어요' : '초대 링크 복사') + '</button></div>' +
      '<div class="stack" style="gap:8px"><div class="label">게임 모드' + (isHost ? ' (방장만 바꿀 수 있어요)' : '') + '</div>' + seg + '<p class="muted" style="font-size:13.5px">' + esc(MODES[V.mode].desc) + '</p></div>' +
      roundsSeg(V, isHost) +
      '<div class="seats">' + seats + '</div>' +
      (isHost
        ? '<button class="btn primary block" type="button" data-act="start"' + (ok && !S.busy ? '' : ' disabled') + '>' + (ok ? n + '명으로 ' + MODES[V.mode].name + ' 시작' : MODES[V.mode].name + '는 ' + min + '명부터 시작할 수 있어요 · ' + (min - n) + '명 더 필요') + '</button>'
        : '<div class="status"><span class="dot"></span><p>' + (ok ? '방장이 게임을 시작하기를 기다리고 있어요.' : MODES[V.mode].name + '는 ' + min + '명부터 시작해요. ' + (min - n) + '명이 더 들어와야 해요.') + '</p></div>') +
      '<p class="hint"><b>친구 초대</b> · 초대 링크를 카카오톡 등으로 보내면 코드가 자동으로 채워져요. 게임이 시작되면 새로 들어올 수 없어요.</p>' +
      '</div>';
  }

  const stepsOf = V => Array.from({ length: V.rounds }, (_, i) => (i + 1) + '라운드').concat(['비밀 투표', '최종 판정']);
  const stepOf = V => (V.phase === 'desc' ? V.round : V.phase === 'vote' || V.phase === 'revote' ? V.rounds : V.rounds + 1);

  function roundsSeg(V, isHost) {
    return '<div class="stack" style="gap:8px"><div class="label">설명 라운드 수' + (isHost ? ' (방장만 바꿀 수 있어요)' : '') + '</div><div class="seg" role="group" aria-label="라운드 수">' +
      [1, 2, 3, 4, 5].map(k => '<button type="button" data-act="setrounds" data-n="' + k + '" aria-pressed="' + (V.roundsSetting === k) + '"' + (isHost && !S.busy ? '' : ' disabled') + '>' + k + '라운드</button>').join('') +
      '</div><p class="muted" style="font-size:13.5px">라운드마다 발표 순서가 무작위로 새로 정해져요.</p></div>';
  }

  function gameView(V) {
    const step = stepOf(V), STEPS = stepsOf(V), key = V.code + V.n;
    if (ui.cardKey !== key) { ui.cardKey = key; ui.cardOpen = false; ui.votePick = null; ui.guessPick = null; }
    const stepper = '<div class="stepper" role="list">' + STEPS.map((s, i) => '<div role="listitem" class="' + (i < step || V.phase === 'end' ? 'done' : i === step ? 'on' : '') + '">' + s + '</div>').join('') + '</div>';
    return stepper + '<div class="table"><aside class="stack">' + roleCard(V) + roster(V) + '</aside><section class="panel stack" style="gap:18px">' + mainPanel(V) + '</section></div>';
  }

  function roleCard(V) {
    const c = V.card;
    let inside;
    if (c.role === 'liar') inside = '<div class="inside liar"><span class="label" style="color:var(--liar)">내 역할 · 라이어</span><div class="word">당신은 라이어입니다.</div><p class="muted" style="font-size:13.5px">제시어를 몰라요. 카테고리만 보고 시민인 척 설명하세요.</p></div>';
    else if (c.role === 'spy') inside = '<div class="inside spy"><span class="label" style="color:var(--amber)">내 역할 · 스파이</span><div class="word">' + esc(c.word) + '</div><div class="spyline">라이어는 <b>' + esc(nick(V, c.liar)) + '</b>님이에요.</div><p class="muted" style="font-size:13.5px">시민인 척하면서 라이어가 걸리지 않게 도와주세요.</p></div>';
    else inside = '<div class="inside"><span class="label">내 역할 · 시민</span><div class="word">' + esc(c.word) + '</div><p class="muted" style="font-size:13.5px">제시어를 직접 말하지 않고 설명하세요.</p></div>';
    return '<div class="rolecard' + (ui.cardOpen ? ' open' : '') + '">' +
      '<div class="cat"><span>카테고리 · <b>' + esc(V.category) + '</b></span><span>' + V.size + '명</span></div>' +
      '<div class="secret">' + inside + '<div class="veil" aria-hidden="' + ui.cardOpen + '"><div><b>내 역할과 제시어</b><span>PC는 마우스를 올리면, 휴대폰은 아래 역할 확인 버튼을 누르면 보여요</span></div></div></div>' +
      '<div class="foot"><span>' + (V.me + 1) + '번 자리 · ' + V.n + '번째 판</span><button type="button" class="btn small" data-act="togglecard" aria-pressed="' + ui.cardOpen + '">' + (ui.cardOpen ? '다시 가리기' : '역할 확인') + '</button></div></div>';
  }

  function roster(V) {
    const rows = V.players.map((p, i) => {
      let st = '';
      if (V.phase === 'desc') st = i === V.turnSeat ? '설명 차례' : '';
      else if (V.phase === 'vote') st = V.voted[i] ? '투표 완료' : '투표 중';
      else if (V.phase === 'revote') st = V.voted[i] ? '투표 완료' : V.ties.includes(i) ? '동률 후보' : '투표 중';
      else if (V.phase === 'guess') st = i === V.suspect ? '지목됨' : '';
      const turn = (V.phase === 'desc' && i === V.turnSeat) || (V.phase === 'guess' && i === V.suspect);
      return '<div class="rp' + (turn ? ' turn' : '') + '"><span class="no">' + (i + 1) + '</span><span class="nm"><span class="live' + (p.online ? ' yes' : '') + '" title="' + (p.online ? '접속 중' : '접속 끊김') + '"></span>' + esc(p.nick) + (i === V.me ? ' <span class="tag me">나</span>' : '') + '</span><span class="st">' + st + '</span></div>';
    }).join('');
    const stop = V.host === V.me && V.phase !== 'end' ? '<button class="btn ghost small" type="button" data-act="abort" style="margin:8px 10px 4px">' + (ui.abort ? '한 번 더 누르면 중단돼요' : '게임 중단하고 대기실로') + '</button>' : '';
    return '<div class="panel" style="padding:12px"><div class="label" style="padding:4px 10px 8px">참가자</div><div class="roster">' + rows + '</div>' + stop + '</div>';
  }

  const waitBox = text => '<div class="status"><span class="dot"></span><p>' + text + '</p></div>';

  function descLog(V) {
    let out = '<div class="log">';
    for (let r = 0; r < V.rounds; r++) {
      const ord = V.orders[r];
      if (!ord) { out += '<div class="round"><h3>' + (r + 1) + '라운드 · 발표 순서는 이 라운드가 시작될 때 공개돼요</h3></div>'; continue; }
      out += '<div class="round"><h3>' + (r + 1) + '라운드</h3><div class="lines">';
      for (let s = 0; s < V.size; s++) {
        const k = r * V.size + s, d = V.desc[k], now = V.phase === 'desc' && V.turn === k, who = ord[s];
        const txt = d ? esc(d.text) : now ? '작성 중…' : '차례 대기';
        out += '<div class="line' + (d ? '' : ' pending') + (now ? ' now' : '') + '"><span class="no">' + (s + 1) + '</span><span class="who">' + esc(nick(V, who)) + '</span><span class="txt">' + txt + '</span></div>';
      }
      out += '</div></div>';
    }
    return out + '</div>';
  }

  function mainPanel(V) {
    const busy = S.busy ? ' disabled' : '';
    if (V.phase === 'desc') {
      const mine = V.turnSeat === V.me;
      let top = '<div><span class="label">' + (V.round + 1) + ' / ' + V.rounds + '라운드 · 전체 ' + (V.turn + 1) + ' / ' + (V.size * V.rounds) + '</span><h2>' + (mine ? '<span style="color:var(--mint)">' + esc(nick(V, V.turnSeat)) + '</span>님의 발표 차례입니다 (나)' : esc(nick(V, V.turnSeat)) + '님의 발표 차례입니다') + '</h2>' + (mine ? '<p class="muted">한 줄로 설명해 주세요.</p>' : '') + '</div>';
      if (mine) top += '<div class="stack" style="gap:8px"><div class="compose"><input type="text" id="desc" maxlength="' + V.maxDesc + '" placeholder="' + (V.card.role === 'liar' ? '시민인 척, 들키지 않게' : '제시어를 직접 말하지 않고') + '" autocomplete="off" enterkeyhint="send">' +
        '<button class="btn primary" type="button" data-act="describe"' + busy + '>제출</button></div><span class="count" id="desc-count">0 / ' + V.maxDesc + '</span></div>';
      return top + descLog(V);
    }
    if (V.phase === 'vote' || V.phase === 'revote') {
      const re = V.phase === 'revote', cand = i => i !== V.me && (!re || V.ties.includes(i));
      if (ui.votePick !== null && !cand(ui.votePick)) ui.votePick = null;
      const voted = V.myVote !== null, done = V.voted.filter(Boolean).length;
      const left = V.voted.map((x, i) => (x ? -1 : i)).filter(i => i >= 0);
      let h = '<div class="row" style="justify-content:space-between"><div><span class="label">' + (re ? '2차 투표 · 동률 후보 중에서' : '비밀 투표') + '</span><h2>' + (voted ? esc(nick(V, V.myVote)) + '님에게 투표했어요' : re ? '동률 후보 중 한 명을 고르세요' : '의심 가는 사람을 한 명 고르세요') + '</h2></div><span class="progress">투표 완료 ' + done + ' / ' + V.size + '</span></div>';
      if (!voted) {
        h += '<div class="picks">' + V.players.map((p, i) => !cand(i) ? '' :
          '<button type="button" class="pick" data-act="pickvote" data-i="' + i + '" aria-pressed="' + (ui.votePick === i) + '"><span class="no">' + (i + 1) + '번</span><b>' + esc(p.nick) + '</b></button>').join('') + '</div>' +
          '<button class="btn primary block" type="button" data-act="vote"' + (ui.votePick === null || S.busy ? ' disabled' : '') + '>' + (ui.votePick === null ? '한 명을 골라 주세요' : esc(nick(V, ui.votePick)) + '님에게 투표하기') + '</button>';
      } else h += waitBox('남은 사람: ' + esc(names(V, left)) + '. 모두 투표하면 결과가 한꺼번에 공개돼요.');
      if (re) h = tallyView(V, V.tally, '1차 투표 결과') + '<p class="muted" style="font-size:13px">' + esc(names(V, V.ties)) + ' 동률이에요. 이 중에서 다시 투표해요.</p>' + h;
      return h + descLog(V);
    }
    if (V.phase === 'guess') {
      let h = '<div><span class="label">최종 판정</span><h2>' + esc(nick(V, V.suspect)) + '님이 지목됐어요</h2></div>' + tallies(V);
      if (V.guessWords) {
        const who = V.mode === 'fool' ? '당신은 사실 <b>바보</b>였어요! 다른 사람들은 다른 제시어를 받았어요. 시민들의 진짜 제시어를 맞히면 역전승이에요.' : '마지막 기회예요. 제시어를 맞히면 라이어 쪽이 이겨요.';
        h += '<div class="status mine">' + who + ' 카테고리 <b>' + esc(V.category) + '</b>에서 하나를 고르세요.</div>' +
          '<div class="picks words">' + V.guessWords.map((w, i) => '<button type="button" class="pick" data-act="pickguess" data-i="' + i + '" aria-pressed="' + (ui.guessPick === i) + '"><b>' + esc(w) + '</b></button>').join('') + '</div>' +
          '<button class="btn primary block" type="button" data-act="guess"' + (ui.guessPick === null || S.busy ? ' disabled' : '') + '>' + (ui.guessPick === null ? '제시어를 골라 주세요' : '"' + esc(V.guessWords[ui.guessPick]) + '"(으)로 정답 제출') + '</button>';
      } else h += waitBox(esc(nick(V, V.suspect)) + '님이 마지막으로 정답을 맞히는 중이에요. 맞히면 판이 뒤집혀요.');
      return h;
    }
    return endView(V);
  }

  function tallyView(V, t, title) {
    t = t || V.tally;
    const max = Math.max(1, ...t);
    return (title ? '<div class="label">' + title + '</div>' : '') + '<div class="tally">' + V.players.map((p, i) => '<div class="bar' + (i === V.suspect ? ' sus' : '') + '"><span class="nm">' + esc(p.nick) + '</span><span class="track"><span class="fill" style="width:' + (t[i] / max * 100) + '%"></span></span><span class="v">' + t[i] + '</span></div>').join('') + '</div>';
  }
  /** 1차(+2차) 투표 결과와 동률 처리 설명 */
  function tallies(V) {
    const two = V.ties.length > 1;
    let h = tallyView(V, V.tally, two ? '1차 투표 결과' : '');
    if (two) {
      h += '<p class="muted" style="font-size:13px">' + esc(names(V, V.ties)) + ' 동률이라 2차 투표를 했어요.</p>' + tallyView(V, V.tally2, '2차 투표 결과');
      if (V.auto === 'caught') h += '<p class="muted" style="font-size:13px">2차에서도 ' + esc(names(V, V.ties2)) + ' 동률이에요. 이 중에 ' + (V.mode === 'fool' ? '바보' : '라이어') + '가 있어서 맞힌 것으로 처리했어요.</p>';
      else if (V.auto === 'missed') h += '<p class="muted" style="font-size:13px">2차에서도 ' + esc(names(V, V.ties2)) + ' 동률이고, 이 중에 ' + (V.mode === 'fool' ? '바보' : '라이어') + '가 없어서 못 맞힌 것으로 처리했어요.</p>';
    }
    return h;
  }

  const ROLE_NAME = { citizen: '시민', liar: '라이어', spy: '스파이', fool: '바보' };
  function endView(V) {
    const R = V.result, myRole = R.roles[V.me];
    const team = r => (r === 'citizen' ? 'citizen' : r === 'fool' ? 'fool' : 'liar');
    const myWin = team(myRole) === R.winner;
    let h = '<div class="verdict ' + R.winner + '"><span class="label">' + (myWin ? '승리했어요' : '아쉽게 졌어요') + ' · 내 역할은 ' + ROLE_NAME[myRole] + '</span><div class="big">' + esc(R.label) + '</div><p class="muted">' + esc(R.reason) + '</p></div>';
    h += '<div class="row" style="justify-content:space-between"><div><span class="label">정답 제시어</span><h2>' + esc(V.category) + ' · ' + esc(R.word) + '</h2>' + (R.foolWord ? '<p class="muted">바보의 제시어: <b style="color:var(--fg)">' + esc(R.foolWord) + '</b></p>' : '') + '</div>' +
      (R.guess !== null ? '<p class="muted">마지막 추측: <b style="color:var(--fg)">' + esc(R.guess) + '</b></p>' : '') + '</div>';
    h += '<div class="reveal">' + V.players.map((p, i) => {
      const r = R.roles[i];
      return '<div class="seat r-' + r + '"><span class="no">' + (i + 1) + '번</span><span class="nm">' + esc(p.nick) + '</span><span class="role">' + ROLE_NAME[r] + (i === V.suspect ? ' · 지목됨' : '') + '</span><small>' + (R.words[i] ? '제시어 ' + esc(R.words[i]) : '제시어 없음') + '</small><small>투표 → ' + esc(nick(V, R.votes[i])) + (R.votes2 && R.votes2[i] !== null ? ' → ' + esc(nick(V, R.votes2[i])) : '') + '</small></div>';
    }).join('') + '</div>';
    h += tallies(V);
    const ok = V.players.length >= V.modes[V.mode].min;
    h += roundsSeg(V, V.host === V.me);
    h += V.host === V.me
      ? '<div class="row"><button class="btn primary" type="button" data-act="restart"' + (S.busy || !ok ? ' disabled' : '') + '>같은 멤버로 다시 하기</button><button class="btn ghost" type="button" data-act="lobby"' + (S.busy ? ' disabled' : '') + '>대기실로 (모드 변경·인원 추가)</button></div>'
      : '<div class="row"><p class="muted" style="flex:1">방장이 다시 시작하면 새 판이 열려요.</p><button class="btn ghost" type="button" data-act="lobby"' + (S.busy ? ' disabled' : '') + '>대기실로</button></div>';
    return h + descLog(V);
  }

  function updateCount(el) { const c = document.getElementById('desc-count'); if (c) c.textContent = [...el.value].length + ' / ' + (S.view ? S.view.maxDesc : 60); }

  // ---------- events ----------
  document.addEventListener('input', e => { if (e.target.id === 'desc') updateCount(e.target); if (e.target.id === 'nick') ls.set('liar.nick', e.target.value); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.target.id === 'desc') { e.preventDefault(); doAct('describe'); }
    if (e.target.id === 'code') { e.preventDefault(); doAct('join'); }
    if (e.target.id === 'nick') { e.preventDefault(); doAct(document.getElementById('code').value.trim() ? 'join' : 'create'); }
  });
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) doAct(b.dataset.act, b); });
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  async function enter(path, body) {
    let res;
    const ok = await act(async () => { res = await post(path, body); });
    if (!ok) return;
    S.token = res.token; ls.set('liar.token', res.token); S.notice = null; S.loading = true;
    if (location.hash) history.replaceState(null, '', location.pathname);
    connect();
  }
  async function doAct(a, el) {
    switch (a) {
      case 'pickmode': ui.mode = el.dataset.mode; ls.set('liar.mode', ui.mode); return queue();
      case 'setrounds': return send('rounds', { rounds: +el.dataset.n });
      case 'setmode': return send('mode', { mode: el.dataset.mode });
      case 'create': return enter('/api/create', { nick: val('nick'), mode: ui.mode });
      case 'join': return enter('/api/join', { nick: val('nick'), code: val('code') });
      case 'leave': if (await send('leave')) { forget(); queue(); } return;
      case 'start': case 'restart': return send('start');
      case 'lobby': return send('lobby');
      case 'abort':
        if (!ui.abort) { ui.abort = true; queue(); setTimeout(() => { ui.abort = false; queue(); }, 4000); return; }
        ui.abort = false; return send('lobby');
      case 'reset': forget(); queue(); return;
      case 'dismiss': S.error = null; S.notice = null; return queue();
      case 'togglecard': ui.cardOpen = !ui.cardOpen; return queue();
      case 'pickvote': ui.votePick = +el.dataset.i; return queue();
      case 'pickguess': ui.guessPick = +el.dataset.i; return queue();
      case 'vote': if (ui.votePick !== null) await send('vote', { target: ui.votePick }); return;
      case 'guess': if (ui.guessPick !== null && S.view.guessWords) await send('guess', { word: S.view.guessWords[ui.guessPick] }); return;
      case 'describe': {
        const d = document.getElementById('desc'); if (!d) return;
        if (await send('describe', { text: d.value })) { const d2 = document.getElementById('desc'); if (d2) d2.value = ''; }
        return;
      }
      case 'copy': {
        const link = location.origin + '/#' + S.view.code;
        try { await navigator.clipboard.writeText(link); ui.copied = true; } catch (err) { S.notice = '복사가 안 되면 링크를 길게 눌러 복사해 주세요: ' + link; }
        queue(); setTimeout(() => { ui.copied = false; queue(); }, 1800);
        return;
      }
    }
  }
  connect(); queue();
})();
</script>
</body>
</html>
